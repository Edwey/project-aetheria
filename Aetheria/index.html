<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetheria - A Cozy 3D Exploration Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      overflow: hidden;
      background: #bde0fe;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }
    #game {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #3d5a80;
      font-size: 22px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.85);
      padding: 12px 24px;
      border-radius: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      backdrop-filter: blur(8px);
    }
    #hud {
      position: fixed;
      top: 16px;
      left: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .hud-card {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(12px);
      padding: 12px 18px;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
      color: #293241;
      font-size: 14px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      max-width: 320px;
    }
    .hud-title {
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-slime {
      background: #ffb5d5;
      color: #5c183b;
    }
    .variant-pills {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      pointer-events: auto;
    }
    .variant-btn {
      flex: 1;
      padding: 5px 8px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 10px;
      border: 1.5px solid transparent;
      background: rgba(0, 0, 0, 0.04);
      color: #495057;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }
    .variant-btn:hover {
      background: rgba(0, 0, 0, 0.08);
    }
    .variant-btn.active {
      background: #ff6fa5;
      color: white;
      border-color: #ff3b86;
    }
    .controls-hint {
      margin-top: 6px;
      font-size: 12px;
      color: #6c757d;
      line-height: 1.45;
    }
    .status-text {
      font-weight: 600;
      color: #3d5a80;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="loading">Loading Aetheria...</div>

  <div id="hud">
    <div class="hud-card">
      <div class="hud-title">
        <span>Aetheria</span>
        <span class="badge badge-slime">Phase 3: Slime</span>
      </div>
      <div id="status-line">Variant: <span class="status-text" id="variant-name">Jelly Ball</span></div>
      <div class="variant-pills">
        <button class="variant-btn" id="btn-goo" data-variant="goo">[1] Goo</button>
        <button class="variant-btn active" id="btn-jelly-ball" data-variant="jelly_ball">[2] Jelly Ball</button>
        <button class="variant-btn" id="btn-jelly-cube" data-variant="jelly_cube">[3] Jelly Cube</button>
      </div>
      <div class="controls-hint">
        <strong>WASD / Arrows:</strong> Move<br>
        <strong>Space:</strong> Hold to charge jump, release / Glide in air<br>
        <strong>M:</strong> Melt into puddle (squeeze)<br>
        <strong>C:</strong> Coiled spring boost | <strong>F:</strong> Ground pound<br>
        <strong>1, 2, 3:</strong> Switch base variant
      </div>
    </div>
  </div>

  <script type="module" src="/app/main.ts"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetheria - Living Creatures & Physics Playground</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      overflow: hidden;
      background: linear-gradient(180deg, #8fd3f4 0%, #eaf7ee 100%);
      font-family: 'Nunito', ui-rounded, system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      color: #1a3322;
    }
    #game {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #1e3d29;
      font-size: 20px;
      font-weight: 800;
      background: rgba(255, 255, 255, 0.9);
      padding: 14px 28px;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(20, 50, 30, 0.15);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .spinner {
      width: 18px;
      height: 18px;
      border: 3px solid rgba(47, 191, 98, 0.2);
      border-top-color: #2fbf62;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Top Form Selector Bar */
    #top-bar {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 251, 240, 0.92);
      backdrop-filter: blur(14px);
      padding: 6px 10px;
      border-radius: 20px;
      border: 1px solid rgba(24, 50, 31, 0.15);
      box-shadow: 0 4px 20px rgba(20, 40, 30, 0.12);
      z-index: 10;
    }
    .creature-tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 14px;
      border: 1.5px solid transparent;
      background: transparent;
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      color: #496352;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .creature-tab:hover {
      background: rgba(47, 191, 98, 0.08);
      color: #18321f;
    }
    .creature-tab.active {
      background: #2fbf62;
      color: #062812;
      box-shadow: 0 2px 8px rgba(47, 191, 98, 0.35);
    }
    .creature-tab.tab-slime.active {
      background: #ff6fa5;
      color: #fff;
      box-shadow: 0 2px 10px rgba(255, 111, 165, 0.4);
    }
    .creature-tab.tab-wisp.active {
      background: #5ab2ff;
      color: #fff;
      box-shadow: 0 2px 10px rgba(90, 178, 255, 0.4);
    }
    .creature-tab.tab-stone.active {
      background: #a39281;
      color: #fff;
      box-shadow: 0 2px 10px rgba(163, 146, 129, 0.4);
    }

    /* Left HUD Card */
    #hud {
      position: fixed;
      top: 16px;
      left: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: none;
      z-index: 10;
    }
    .hud-card {
      background: rgba(255, 251, 240, 0.92);
      backdrop-filter: blur(14px);
      padding: 14px 18px;
      border-radius: 18px;
      box-shadow: 0 4px 20px rgba(20, 40, 30, 0.12);
      color: #18321f;
      font-size: 13px;
      border: 1px solid rgba(24, 50, 31, 0.14);
      width: 320px;
      pointer-events: auto;
    }
    .hud-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .hud-title {
      font-weight: 900;
      font-size: 17px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      padding: 3px 9px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .badge-liquid {
      background: #ffe3ee;
      color: #b01e56;
    }
    .badge-gas {
      background: #e0f2fe;
      color: #0369a1;
    }
    .badge-solid {
      background: #ede8e1;
      color: #5c4d3c;
    }

    /* Variant selection buttons */
    .variant-container {
      margin-top: 6px;
      margin-bottom: 10px;
    }
    .variant-label {
      font-size: 11px;
      font-weight: 800;
      color: #587063;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 5px;
    }
    .variant-pills {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .variant-btn {
      padding: 6px 4px;
      font-size: 12px;
      font-weight: 800;
      font-family: inherit;
      border-radius: 11px;
      border: 1.5px solid rgba(24, 50, 31, 0.14);
      background: rgba(255, 255, 255, 0.7);
      color: #385040;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .variant-btn:hover {
      background: rgba(255, 255, 255, 1);
      border-color: #2fbf62;
    }
    .variant-btn.active {
      background: #2fbf62;
      color: #062812;
      border-color: #26994e;
      box-shadow: 0 2px 6px rgba(47, 191, 98, 0.25);
    }

    /* Meters */
    .meter-box {
      margin-top: 6px;
      margin-bottom: 8px;
    }
    .meter-label-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 800;
      color: #587063;
      margin-bottom: 3px;
    }
    .meter-bar {
      height: 8px;
      background: rgba(24, 50, 31, 0.12);
      border-radius: 6px;
      overflow: hidden;
    }
    .meter-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2fbf62, #6fe096);
      border-radius: 6px;
      transition: width 0.08s ease;
    }
    .meter-fill.wisp-breath {
      background: linear-gradient(90deg, #38bdf8, #818cf8);
    }
    .meter-fill.charge-power {
      background: linear-gradient(90deg, #f59e0b, #ef4444);
    }

    /* Live stats pills */
    .stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid rgba(24, 50, 31, 0.1);
    }
    .stat-chip {
      background: rgba(24, 50, 31, 0.06);
      padding: 3px 7px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      color: #385040;
    }
    .stat-chip strong {
      color: #18321f;
    }

    /* Bottom Ability Action Bar */
    #action-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      background: rgba(255, 251, 240, 0.94);
      backdrop-filter: blur(14px);
      padding: 8px 12px;
      border-radius: 20px;
      border: 1px solid rgba(24, 50, 31, 0.15);
      box-shadow: 0 6px 24px rgba(20, 40, 30, 0.14);
      z-index: 10;
    }
    .act-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 72px;
      padding: 6px 10px;
      border-radius: 13px;
      border: 1.5px solid rgba(24, 50, 31, 0.14);
      background: rgba(255, 255, 255, 0.85);
      font-family: inherit;
      cursor: pointer;
      transition: all 0.12s ease;
      color: #18321f;
    }
    .act-btn:hover {
      background: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
    }
    .act-btn:active, .act-btn.pressed {
      transform: translateY(1px);
      background: #2fbf62;
      color: #062812;
      border-color: #26994e;
    }
    .act-key {
      font-size: 10px;
      font-weight: 900;
      background: rgba(24, 50, 31, 0.08);
      padding: 1px 5px;
      border-radius: 5px;
      margin-bottom: 2px;
    }
    .act-btn.pressed .act-key {
      background: rgba(0, 0, 0, 0.15);
    }
    .act-label {
      font-size: 12px;
      font-weight: 800;
    }

    /* Key legend */
    .controls-legend {
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid rgba(24, 50, 31, 0.1);
      font-size: 11px;
      color: #587063;
      line-height: 1.4;
    }
    .key-badge {
      display: inline-block;
      padding: 1px 4px;
      background: rgba(24, 50, 31, 0.08);
      border: 1px solid rgba(24, 50, 31, 0.15);
      border-radius: 4px;
      font-weight: 800;
      color: #18321f;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="loading">
    <div class="spinner"></div>
    <span>Awakening Aetheria...</span>
  </div>

  <!-- Top Creature Form Switcher Bar -->
  <div id="top-bar">
    <button class="creature-tab tab-slime active" id="tab-slime" data-creature="slime">
      <span>💧</span>
      <span>Slime (Liquid)</span>
    </button>
    <button class="creature-tab tab-wisp" id="tab-wisp" data-creature="wisp">
      <span>💨</span>
      <span>Wisp (Gas)</span>
    </button>
    <button class="creature-tab tab-stone" id="tab-stone" data-creature="stone">
      <span>🪨</span>
      <span>Stone (Solid)</span>
    </button>
  </div>

  <!-- Left Stats & Info Card -->
  <div id="hud">
    <div class="hud-card">
      <div class="hud-header">
        <div class="hud-title">
          <span id="creature-icon">💧</span>
          <span id="creature-name">Slime</span>
        </div>
        <span class="badge badge-liquid" id="creature-badge">Liquid Form</span>
      </div>

      <div class="variant-container">
        <div class="variant-label">Active Variant (Keys 1 / 2 / 3)</div>
        <div class="variant-pills" id="variant-pills">
          <!-- Dynamically populated buttons -->
        </div>
      </div>

      <!-- Live Meter (Breath for Wisp, Jump Charge for Slime/Stone) -->
      <div class="meter-box">
        <div class="meter-label-row">
          <span id="meter-title">Jump Power Charge</span>
          <span id="meter-val">0%</span>
        </div>
        <div class="meter-bar">
          <div class="meter-fill" id="meter-fill"></div>
        </div>
      </div>

      <!-- Dynamic Live Stats -->
      <div class="stats-row" id="stats-row">
        <span class="stat-chip">Speed: <strong id="stat-speed">0.0 m/s</strong></span>
        <span class="stat-chip">Grip: <strong id="stat-grip">0.80</strong></span>
        <span class="stat-chip">State: <strong id="stat-state">Grounded</strong></span>
      </div>

      <div class="controls-legend">
        <span class="key-badge">WASD</span> Move &bull;
        <span class="key-badge">Tab</span> Next Creature &bull;
        <span class="key-badge">1, 2, 3</span> Switch Variant
      </div>
    </div>
  </div>

  <!-- Bottom Clickable Ability Deck -->
  <div id="action-bar">
    <button class="act-btn" id="act-jump" data-btn="jump">
      <span class="act-key">Space</span>
      <span class="act-label" id="lbl-jump">Hop / Jump</span>
    </button>
    <button class="act-btn" id="act-melt" data-btn="melt">
      <span class="act-key">M</span>
      <span class="act-label" id="lbl-melt">Melt</span>
    </button>
    <button class="act-btn" id="act-spring" data-btn="spring">
      <span class="act-key">C</span>
      <span class="act-label" id="lbl-spring">Spring</span>
    </button>
    <button class="act-btn" id="act-float" data-btn="float" style="display: none;">
      <span class="act-key">V</span>
      <span class="act-label">Float</span>
    </button>
    <button class="act-btn" id="act-pound" data-btn="pound">
      <span class="act-key">F</span>
      <span class="act-label" id="lbl-pound">Pound</span>
    </button>
  </div>

  <script type="module" src="/app/main.ts"></script>
</body>
</html>
